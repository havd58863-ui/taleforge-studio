name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install minimal dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-lite.txt pytest

      - name: Lint syntax
        run: python -m compileall -q app scripts tests

      - name: Run pytest
        run: python -m pytest

      - name: Run smoke test
        run: python scripts/smoke_test.py
        env:
          APP_ENV: testing
          SECRET_KEY: ci-test-key
